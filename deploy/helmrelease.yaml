apiVersion: v1
kind: Namespace
metadata:
  name: meal-manager
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: meal-manager
  namespace: meal-manager
spec:
  chart:
    spec:
      chart: ./meal-manager
      sourceRef:
        kind: GitRepository
        name: meal-manager-repo
        namespace: flux-system
  values:
    replicaCount: 3
    image:
      repository: mealmanager/backend
      tag: latest
    service:
      type: LoadBalancer
