apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meal-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kaoserahamed/Meal_Manager_android_app.git
    targetRevision: main
    path: deploy/helm/meal-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: meal-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
