apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: meal-manager-success
spec:
  args:
  - name: service-name
  metrics:
  - name: error-rate
    interval: 2m
    successCondition: result < 0.01
    provider:
      prometheus:
        address: http://prometheus.monitoring.svc.cluster.local
        query: |
          sum(rate(http_server_requests_seconds_count{status=~"5..",app="$service-name"}[5m])) /
          sum(rate(http_server_requests_seconds_count{app="$service-name"}[5m]))
