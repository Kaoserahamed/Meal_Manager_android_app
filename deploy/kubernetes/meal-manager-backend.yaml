apiVersion: apps/v1
kind: Deployment
metadata:
  name: meal-manager-backend
  labels:
    app: meal-manager-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: meal-manager-backend
  template:
    metadata:
      labels:
        app: meal-manager-backend
    spec:
      containers:
      - name: backend
        image: mealmanager/backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: meal-manager-secrets
              key: db-password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: meal-manager-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/monitoring/health
            port: 8080
          initialDelaySeconds: 30
        readinessProbe:
          httpGet:
            path: /api/v1/monitoring/health
            port: 8080
          initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: meal-manager-backend
spec:
  selector:
    app: meal-manager-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: LoadBalancer
---
apiVersion: v1
kind: Secret
metadata:
  name: meal-manager-secrets
type: Opaque
stringData:
  db-password: password
  jwt-secret: dev-secret-change-me
